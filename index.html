<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>¡Felicidades George!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>
  :root { --noche:#0a0620; --oro:#ffd76a; }
  * { box-sizing:border-box; margin:0; }
  html, body { height:100%; background:var(--noche); overflow:hidden; }
  body { font-family:'Fraunces', Georgia, 'Times New Roman', serif; color:#fff; }

  #escena { position:fixed; inset:0; }
  .slide { position:absolute; inset:0; opacity:0; transition:opacity 1.4s ease-in-out; }
  .slide.activa { opacity:1; }
  .slide .fondo { position:absolute; inset:-6%; width:112%; height:112%; object-fit:cover;
    filter:blur(28px) brightness(.55) saturate(1.2); }
  .slide .foto { position:absolute; inset:0; width:100%; height:100%; object-fit:contain;
    transform:scale(1.04); transition:transform 10s linear; }
  .slide.activa .foto { transform:scale(1); }

  .leyenda { position:absolute; left:0; right:0; bottom:0; padding:22vh 6vw calc(6vh + env(safe-area-inset-bottom, 0px));
    text-align:center; background:linear-gradient(to top, rgba(8,4,25,.92) 0%, rgba(8,4,25,.7) 45%, rgba(8,4,25,0) 100%);
    opacity:0; transform:translateY(14px); transition:opacity 1s ease .9s, transform 1s ease .9s; }
  .slide.activa .leyenda { opacity:1; transform:none; }
  .leyenda h1 { font-size:clamp(2rem, 7.5vw, 3.6rem); line-height:1.15; font-weight:600; font-style:italic;
    color:#fff; text-shadow:0 2px 6px rgba(0,0,0,.9), 0 0 24px rgba(0,0,0,.7); }
  .leyenda h1.larga { font-size:clamp(1.5rem, 5.6vw, 2.6rem); }
  .final .leyenda h1 { color:var(--oro); font-size:clamp(2.3rem, 9vw, 4.4rem);
    text-shadow:0 2px 6px rgba(0,0,0,.95), 0 0 28px rgba(255,180,60,.55); }

  #btn { margin-top:2.2vh; font:inherit; font-style:normal; font-size:1.15rem; padding:.75em 1.8em; border-radius:999px;
    border:2px solid var(--oro); background:rgba(10,6,32,.85); color:var(--oro); cursor:pointer;
    opacity:0; pointer-events:none; transition:opacity .8s ease 2.4s, background .2s, color .2s; }
  .final.activa #btn { opacity:1; pointer-events:auto; }
  #btn:hover, #btn:focus-visible { background:var(--oro); color:var(--noche); outline:none; }

  #inicio { position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1.4rem; padding:2rem; text-align:center;
    background:radial-gradient(ellipse at 50% 30%, #2a1160 0%, #0a0620 70%); transition:opacity 1s ease; }
  #inicio.oculto { opacity:0; pointer-events:none; }
  #inicio h1 { font-size:clamp(2.4rem, 10vw, 4.4rem); font-style:italic; color:var(--oro); text-shadow:0 0 30px rgba(255,180,60,.5); }
  #inicio p { font-size:1.1rem; color:#fff; opacity:.9; }
  #inicio button { font:inherit; font-size:1.25rem; padding:.8em 2.2em; border-radius:999px; border:2px solid var(--oro); background:var(--oro); color:var(--noche); cursor:pointer; }
  #sonido { position:fixed; top:calc(12px + env(safe-area-inset-top, 0px)); right:12px; z-index:8; width:44px; height:44px; border-radius:50%;
    border:1.5px solid rgba(255,255,255,.7); background:rgba(10,6,32,.6); color:#fff; font-size:1.2rem; cursor:pointer; }
  #fx { position:fixed; inset:0; width:100%; height:100%; pointer-events:none; z-index:5; }
  #destello { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:6; }
  #progreso { position:fixed; top:0; left:0; height:4px; width:0; z-index:7; background:linear-gradient(90deg,#ff5e7e,#ffd76a,#5ee7ff); }

  @media (prefers-reduced-motion:reduce) { .slide .foto { transition:none; transform:none; } }
</style>
</head>
<body>
<div id="escena"></div>
<canvas id="fx"></canvas>
<div id="destello"></div>
<div id="progreso"></div>
<div id="inicio">
  <h1>¡Que los cumplas feliz George!</h1>
  <p>Sube el volumen 🔊</p>
  <button id="empezar" type="button">Comenzar ❤️</button>
</div>
<button id="sonido" type="button" aria-label="Sonido" title="Sonido">🔊</button>

<script>
const DURACION = 10000;
const SLIDES = [
  { src: "imagenes/edwinydiego.jpg",  texto: "¡Feliz cumple George, pásatela muy bien, te quiero mucho!\n\n¡Que los cumplas muy feliz papá!" },
  { src: "imagenes/jair.jpg",   texto: "¡Te amo padre. Feliz cumple!" },
  { src: "imagenes/guntercindo.jpg",   texto: "¡guau-guau-guau guau gau!" },
  { src: "imagenes/amennu.jpg", texto: "¡Mis mejores deseos para la mujer más hermosa!\n¡Felicidades mi Amennu!" },
  { src: "imagenes/todos.jpg",  texto: "¡Muchas felicidades George 🥳!", final: true }
];

/* ---------- Construcción de las diapositivas ---------- */
const escena = document.getElementById('escena');
const nodos = SLIDES.map(s => {
  const d = document.createElement('div');
  d.className = 'slide' + (s.final ? ' final' : '');
  d.innerHTML = '<img class="fondo" alt=""><img class="foto" alt="' + s.texto.replace(/\n/g, ' ') + '">' +
    '<div class="leyenda"><h1' + (s.texto.length > 30 && !s.final ? ' class="larga"' : '') + '>' + s.texto.replace(/\n/g, '<br>') + '</h1></div>';
  d.querySelector('.fondo').src = s.src;
  d.querySelector('.foto').src = s.src;
  if (s.final) {
    const b = document.createElement('button');
    b.id = 'btn'; b.type = 'button'; b.textContent = 'Volver a empezar';
    d.querySelector('.leyenda').appendChild(b);
  }
  escena.appendChild(d);
  return d;
});

/* ---------- Fuegos artificiales ---------- */
const cv = document.getElementById('fx'), ctx = cv.getContext('2d');
let W, H, dpr;
function ajustar() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
addEventListener('resize', ajustar); ajustar();

const cohetes = [], chispas = [];
const rnd = (a, b) => a + Math.random() * (b - a);

function lanzar(x, altura) {
  const h = altura || rnd(.25, .55) * H;
  cohetes.push({ x: x ?? rnd(.15, .85) * W, y: H, vy: -Math.sqrt(2 * .2 * (H - h)), hue: rnd(0, 360) });
}
function explotar(x, y, hue) {
  const n = 110, dos = Math.random() < .5;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = rnd(1.5, 6.5);
    chispas.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v,
      vida: 1, caida: rnd(.011, .02), tam: rnd(1.5, 3),
      hue: (dos && i % 2 ? hue + 150 : hue) + rnd(-18, 18) });
  }
}
function tick() {
  ctx.globalCompositeOperation = 'destination-out';
  ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter';
  for (let i = cohetes.length - 1; i >= 0; i--) {
    const c = cohetes[i]; c.y += c.vy; c.vy += .2;
    ctx.fillStyle = 'hsl(' + c.hue + ',100%,80%)';
    ctx.beginPath(); ctx.arc(c.x, c.y, 2.4, 0, 7); ctx.fill();
    if (c.vy >= -.5) { explotar(c.x, c.y, c.hue); cohetes.splice(i, 1); }
  }
  for (let i = chispas.length - 1; i >= 0; i--) {
    const p = chispas[i];
    p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy = p.vy * .985 + .045; p.vida -= p.caida;
    if (p.vida <= 0) { chispas.splice(i, 1); continue; }
    ctx.fillStyle = 'hsla(' + p.hue + ',100%,' + (55 + 25 * p.vida) + '%,' + p.vida + ')';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.tam * (.5 + p.vida / 2), 0, 7); ctx.fill();
  }
  requestAnimationFrame(tick);
}
tick();

const destello = document.getElementById('destello');
function transicion() {               // 4 cohetes escalonados + destello
  [0, 220, 450, 700].forEach((t, i) => setTimeout(() => lanzar(W * (.2 + i * .2 + rnd(-.05, .05))), t));
  setTimeout(() => {
    destello.style.transition = 'none'; destello.style.opacity = .55;
    requestAnimationFrame(() => { destello.style.transition = 'opacity 1.1s ease-out'; destello.style.opacity = 0; });
  }, 900);
}

/* ---------- Secuencia ---------- */
const barra = document.getElementById('progreso');
let actual = -1, reloj = null;

function mostrar(i, conFuegos) {
  clearTimeout(reloj);
  if (conFuegos) transicion();
  setTimeout(() => {
    nodos.forEach((n, k) => n.classList.toggle('activa', k === i));
    actual = i;
    barra.style.transition = 'none'; barra.style.width = '0';
    if (!SLIDES[i].final) {
      requestAnimationFrame(() => requestAnimationFrame(() => {
        barra.style.transition = 'width ' + DURACION + 'ms linear'; barra.style.width = '100%';
      }));
      reloj = setTimeout(() => mostrar(i + 1, true), DURACION);
    } else {
      // Última imagen: se queda fija; solo se repite si se aprieta el botón.
      for (let k = 0; k < 5; k++) setTimeout(() => lanzar(), k * 500);
    }
  }, conFuegos ? 900 : 0);
}

document.getElementById('btn').addEventListener('click', () => mostrar(0, true));
const listas = Promise.race([
  Promise.all(SLIDES.map(s => new Promise(r => { const im = new Image(); im.onload = im.onerror = r; im.src = s.src; }))),
  new Promise(r => setTimeout(r, 6000))
]);

/* ---------- Música: Las Mañanitas ---------- */
const musica = new Audio('audio/mananitas.mp3');
musica.loop = true; musica.preload = 'auto'; musica.volume = 0;
const bSonido = document.getElementById('sonido');
musica.addEventListener('error', () => { bSonido.style.display = 'none'; });   // sin archivo: sigue en silencio
bSonido.addEventListener('click', () => { musica.muted = !musica.muted; bSonido.textContent = musica.muted ? '🔇' : '🔊'; });
function sonar() {
  musica.play().then(() => {
    const f = setInterval(() => { musica.volume = Math.min(.85, musica.volume + .05); if (musica.volume >= .85) clearInterval(f); }, 200);
  }).catch(() => {});
}

/* El navegador solo permite audio tras un toque: por eso la pantalla de inicio */
document.getElementById('empezar').addEventListener('click', () => {
  document.getElementById('inicio').classList.add('oculto');
  sonar();
  listas.then(() => mostrar(0, true));
});
</script>
</body>
</html>
